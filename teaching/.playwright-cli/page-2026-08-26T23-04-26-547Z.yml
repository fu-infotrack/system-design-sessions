  - heading "When a lock cannot help" [level=1] [ref=e3]
  - paragraph [ref=e4]: There is a class of problem where no lock, however correct, prevents the thing you are worried about. Recognising it is the single most valuable habit in this course.
  - heading "The knowledge" [level=2] [ref=e5]
  - paragraph [ref=e6]: "Take the classic:"
  - code [ref=e8]: "// runs on 3 pods if (order.Status == Pending) { await _payments.ChargeAsync(order); // the side effect order.Status = Paid; await _db.SaveChangesAsync(); }"
  - paragraph [ref=e9]: "Everyone reaches for a distributed lock. Now look closely at what a lock would have to guarantee — and notice that it cannot:"
  - generic [ref=e10]:
    - generic [ref=e11]: The core idea
    - paragraph [ref=e12]:
      - strong [ref=e13]: The lock and the charge cannot commit together.
      - text: They live in different systems, so whatever order you choose, there is an instant where one has happened and the other has not. Crash there and you cannot tell which.
  - paragraph [ref=e14]:
    - text: Work it through. You hold the lock, you call the payment provider, and the response times out. Did the charge happen? You cannot know. Release the lock and retry, and you may charge twice —
    - emphasis [ref=e15]: while correctly holding the lock the whole time
    - text: .
  - paragraph [ref=e16]:
    - text: Mutual exclusion answers "is anyone else doing this?" It cannot answer "did
    - emphasis [ref=e17]: I
    - text: already do this?" — and that second question is the one that matters the moment an effect leaves your process.
  - heading "The tell" [level=3] [ref=e18]
  - paragraph [ref=e19]: "Ask where the effect lands:"
  - table [ref=e20]:
    - rowgroup [ref=e21]:
      - row "Lands inside your store Leaves your store" [ref=e22]:
        - columnheader "Lands inside your store" [ref=e23]
