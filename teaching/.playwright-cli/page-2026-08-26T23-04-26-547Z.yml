        - cell "a payment, an email, a partner API" [ref=e28]
      - row "a lock can be atomic with it nothing can be atomic with it" [ref=e29]:
        - cell "a lock can be atomic with it" [ref=e30]
        - cell "nothing can be atomic with it" [ref=e31]
      - row "lock, or a constraint, or a version check idempotency" [ref=e32]:
        - cell "lock, or a constraint, or a version check" [ref=e33]
        - cell "idempotency" [ref=e34]:
          - strong [ref=e35]: idempotency
  - paragraph [ref=e36]:
    - text: Inside your store you have a real option, because the lock and the write can commit or roll back together — that is why
    - code [ref=e37]: SELECT … FOR UPDATE
    - text: in one transaction is stronger than any Redis lease. Outside, you need the operation to be
    - emphasis [ref=e38]: safe to repeat
    - text: ", which is a property of the operation, not of who is allowed to run it."
  - paragraph [ref=e39]:
    - text: The usual mechanism is an
    - strong [ref=e40]: idempotency key
    - text: the far side deduplicates on — you send the same key, they charge once. Most payment and messaging APIs support it.
    - emphasis [ref=e41]: How
    - text: to build that is session 3's subject (Competing Consumer & Idempotency); here we only need you to recognise when you have reached the boundary.
