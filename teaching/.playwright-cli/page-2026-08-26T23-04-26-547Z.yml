  - heading "What to take away" [level=2] [ref=e81]
  - paragraph [ref=e82]:
    - text: When the effect leaves your process, a lock demotes from
    - emphasis [ref=e83]: the solution
    - text: to
    - emphasis [ref=e84]: an optimisation
    - text: . It stops duplicate work most of the time, which may be worth having — but it is not what makes you correct, and it should not be described in the code as though it is.
  - paragraph [ref=e85]:
    - text: "The sentence to carry into review:"
    - strong [ref=e86]: "\"a lock stops two people doing it at once; it does not stop one person doing it twice.\""
