  - heading "What to take away" [level=2] [ref=e85]
  - paragraph [ref=e86]: The sort is not academic. It tells you when to stop.
  - list [ref=e87]:
    - listitem [ref=e88]:
      - strong [ref=e89]: Efficiency
      - text: → a Redis lease is fine. Accept the occasional double-run and say so in a comment.
    - listitem [ref=e90]:
      - strong [ref=e91]: Correctness
      - text: → do not go looking for a better lock. Go looking for a way to make the second run harmless, or to make the resource refuse it.
  - paragraph [ref=e92]: The most common expensive mistake on a team is spending a week hardening a lock for a problem in the right-hand column, where no amount of hardening helps.
