  - paragraph [ref=e35]:
    - text: That second row is the useful one. If you are in the efficiency column, the cheapest thing that mostly works is the
    - emphasis [ref=e36]: right
    - text: answer — reach for it, write a comment saying the lock is approximate, and move on.
  - paragraph [ref=e37]: "The third row is the one that surprises people. Martin Kleppmann's argument, which the Redis documentation now repeats in its own voice, is that a lock with a timeout cannot deliver correctness by itself:"
  - blockquote [ref=e38]:
    - text: You should implement fencing tokens… This applies to any distributed locking system.
    - generic [ref=e39]:
      - text: —
      - link "redis.io, Distributed locks" [ref=e40] [cursor=pointer]:
        - /url: https://redis.io/docs/latest/develop/use/patterns/distributed-locks/
  - paragraph [ref=e41]:
    - text: "Why: every distributed lock needs a time limit, because if the holder dies nothing else can release it. And the moment it has a time limit,"
    - strong [ref=e42]: it can expire while you are still working
    - text: — a garbage-collection pause is enough. Two processes then hold it, and neither knows.
  - paragraph [ref=e43]: So in the correctness column, mutual exclusion is not the answer. Something must reject the stale writer — the database checking a version, or the storage service refusing a write without the current lease. We cover that in lesson 3.
