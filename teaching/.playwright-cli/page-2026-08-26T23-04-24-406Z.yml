  - paragraph [ref=e81]: "If the answer is a property of the data, you have options — and lesson 4 and the framework will give you several better than a lock. If the answer is a property of the code, push back before the lock goes in: the design is not understood yet, and a lock will preserve the misunderstanding rather than fix it."
