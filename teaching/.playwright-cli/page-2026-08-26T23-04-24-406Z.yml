  - generic [ref=e27]:
    - generic [ref=e28]: Why it matters
    - paragraph [ref=e29]:
      - text: An invariant can be enforced somewhere other than a lock — a unique index, a version check, a routing decision. A symptom can only be defended against.
      - strong [ref=e30]: If you cannot name the invariant, a lock is a guess.
  - heading "The test" [level=3] [ref=e31]
  - paragraph [ref=e32]:
    - text: "A good invariant survives this question:"
    - emphasis [ref=e33]: could someone violate this without running my code at all?
  - paragraph [ref=e34]: "\"A customer has one active subscription\" survives — a migration or a manual `INSERT` could break it, which tells you the database should hold the rule. \"Two threads shouldn't run this method\" does not survive; it is not a fact about anything, and there is nowhere to put it but a lock."
  - heading "The practice" [level=2] [ref=e35]
  - paragraph [ref=e36]: For each pull request comment, is the stated reason an invariant or a symptom?
