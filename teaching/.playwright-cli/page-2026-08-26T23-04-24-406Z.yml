  - paragraph [ref=e6]:
    - text: An
    - strong [ref=e7]: invariant
    - text: is something that must stay true about your data or the world, no matter how many things run at once.
  - paragraph [ref=e8]: "When someone adds a lock, ask what it protects. You will get one of two kinds of answer, and they are not equally useful:"
