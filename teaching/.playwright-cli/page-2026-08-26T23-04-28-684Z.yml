  - heading "The trap everyone falls into" [level=3] [ref=e53]
  - paragraph [ref=e54]:
    - text: "Processing is slow, so you raise the timeout. But Service Bus spells out the cost:"
    - emphasis [ref=e55]: "\"when your client stops working, the message becomes available again only after the lock duration passes.\""
  - paragraph [ref=e56]:
    - text: So a longer lease means slower recovery from a genuinely dead worker, and a shorter one means more zombies.
    - strong [ref=e57]: You are choosing between duplicate work and delayed work, and no number escapes the choice.
    - text: Renewal — Service Bus auto-renew, Kafka's background heartbeat — narrows the window without closing it, because the renewal and the work stop at different moments.
